# Security updates only: routine version bumps are turned off by
# open-pull-requests-limit: 0, so this file changes nothing for reviewers.
#
# sprintf-js is ignored because the advisory has no patched release:
#   GHSA-hp3w-g68c-fv3c / CVE-2026-97058, vulnerable range <= 1.1.3, patched: none.
# It is a development dependency reached through argparse (CLI tooling), not part
# of any published runtime path. Remove this entry once npm ships a fixed version.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "sprintf-js"
        versions: ["<= 1.1.3"]
